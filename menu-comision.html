<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Global - Comisiones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-zinc-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header Global -->
  <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex justify-between items-center shadow-sm sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2.5 rounded-xl">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      </div>
      <h1 class="text-xl font-black text-slate-900 tracking-tight">Panel Docente</h1>
    </div>
    
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-3 text-right">
        <div class="hidden sm:block">
          <p class="text-sm font-bold text-slate-800">Prof. Laura Martínez</p>
          <p class="text-xs text-slate-500">laura.m@universidad.edu</p>
        </div>
        <img src="https://ui-avatars.com/api/?name=Laura+Martinez&background=e0e7ff&color=4f46e5&bold=true" alt="Avatar" class="w-11 h-11 rounded-full border-2 border-indigo-100">
      </div>
      <button class="text-slate-400 hover:text-slate-700 bg-slate-50 hover:bg-slate-100 p-2.5 rounded-xl transition-colors cursor-pointer" title="Cerrar Sesión">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-[1400px] w-full mx-auto p-4 sm:p-8">
    
    <!-- Barra de acciones superior -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
      <div>
        <h2 class="text-3xl font-black text-slate-800">Mis Comisiones</h2>
        <p class="text-slate-500 font-medium mt-1">1er Cuatrimestre 2026</p>
      </div>
      <div class="flex gap-3 w-full sm:w-auto">
        <button class="flex-1 sm:flex-none bg-white border-2 border-slate-200 text-slate-700 hover:border-slate-300 hover:bg-slate-50 font-bold py-3 px-5 rounded-2xl transition-all cursor-pointer">
          Crear Materia
        </button>
        <button class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-5 rounded-2xl transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 cursor-pointer">
          <span class="text-xl leading-none">+</span> Nueva Comisión
        </button>
      </div>
    </div>

    <!-- Grilla de Tarjetas -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <!-- Tarjeta Comisión 1 -->
      <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 hover:shadow-xl hover:shadow-slate-200/50 hover:border-indigo-100 transition-all group flex flex-col h-full">
        <div class="flex justify-between items-start mb-4">
          <span class="bg-indigo-100 text-indigo-700 text-xs font-bold uppercase tracking-wider px-3 py-1.5 rounded-lg">Programación II</span>
          <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1.5 rounded-lg flex items-center gap-1">
            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> Activa
          </span>
        </div>
        
        <h3 class="text-2xl font-black text-slate-800 mb-1">Comisión A</h3>
        <p class="text-sm text-slate-500 font-medium mb-6">Lunes y Miércoles - Turno Mañana</p>
        
        <!-- Estadísticas rápidas -->
        <div class="grid grid-cols-2 gap-3 mb-8 bg-slate-50 rounded-2xl p-4">
          <div>
            <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Alumnos</span>
            <span class="text-xl font-black text-slate-700">42</span>
          </div>
          <div>
            <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Grupos</span>
            <span class="text-xl font-black text-slate-700">12</span>
          </div>
        </div>
        
        <!-- Acciones de la tarjeta -->
        <div class="mt-auto grid grid-cols-2 gap-3">
          <button class="col-span-2 bg-indigo-50 hover:bg-indigo-600 text-indigo-700 hover:text-white font-bold py-3.5 rounded-xl transition-colors cursor-pointer text-sm">
            ▶️ Abrir Consola de Clase
          </button>
          <button class="bg-white border-2 border-slate-100 hover:border-slate-300 text-slate-600 font-bold py-2.5 rounded-xl transition-colors cursor-pointer text-sm">
            ⚙️ Configurar
          </button>
          <button class="bg-white border-2 border-slate-100 hover:border-slate-300 text-slate-600 font-bold py-2.5 rounded-xl transition-colors cursor-pointer text-sm">
            👥 Alumnos
          </button>
        </div>
      </div>

      <!-- Tarjeta Comisión 2 -->
      <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 hover:shadow-xl hover:shadow-slate-200/50 hover:border-indigo-100 transition-all group flex flex-col h-full">
        <div class="flex justify-between items-start mb-4">
          <span class="bg-slate-100 text-slate-600 text-xs font-bold uppercase tracking-wider px-3 py-1.5 rounded-lg">Bases de Datos</span>
          <span class="bg-slate-100 text-slate-500 text-xs font-bold px-2 py-1.5 rounded-lg">
            Borrador
          </span>
        </div>
        
        <h3 class="text-2xl font-black text-slate-800 mb-1">Comisión Única</h3>
        <p class="text-sm text-slate-500 font-medium mb-6">Viernes - Turno Noche</p>
        
        <!-- Estadísticas rápidas -->
        <div class="grid grid-cols-2 gap-3 mb-8 bg-rose-50 rounded-2xl p-4 border border-rose-100">
          <div class="col-span-2 flex items-center gap-2">
            <span class="text-rose-500">⚠️</span>
            <span class="text-sm font-bold text-rose-700">Falta importar alumnos</span>
          </div>
        </div>
        
        <!-- Acciones de la tarjeta -->
        <div class="mt-auto grid grid-cols-1 gap-3">
          <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition-colors cursor-pointer text-sm shadow-md shadow-indigo-200">
            Importar desde SIU Guaraní
          </button>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
